# Reforço para o servidor do Render (plano grátis) não dormir: visita a cada 10 minutos.
# O próprio servidor também se visita (ManterAcordado.java); isto acorda ele se algo o derrubar.
# A rota /actuator/health não consulta o banco, então o Neon continua dormindo quando ninguém usa.
name: Manter acordado

# Horários em UTC (Brasília = UTC-3). Pausa das 02:00 às 08:00 de Brasília (05:00–11:00 UTC):
# a última visita é 01:50 e às 07:50 ele é acordado para estar pronto às 08:00.
on:
  schedule:
    - cron: "*/10 0-4,11-23 * * *"
    - cron: "50 10 * * *"
  workflow_dispatch: {}

jobs:
  cutucar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar o servidor
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://vetrina-42b1.onrender.com/actuator/health || true)
          echo "HTTP $code"
