services:
  db:
    image: postgres:17-alpine
    container_name: erp-db
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"   # 5433 no host para não conflitar com um Postgres local
    volumes:
      - erp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: erp-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/erp
      DB_USER: erp
      DB_PASSWORD: erp
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-por-um-valor-longo-e-aleatorio-123456}
      ADMIN_EMAIL: admin@erp.com
      ADMIN_SENHA: admin123
      SEED_DEMO: "true"
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    container_name: erp-web
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  erp-data:
