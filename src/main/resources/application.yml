server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: erp-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
  jpa:
    open-in-view: false
    hibernate:
      # "update" cria/ajusta as tabelas automaticamente. Em produção, troque por Flyway/Liquibase + "validate".
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Troque em produção (mínimo 32 caracteres). Use a variável de ambiente JWT_SECRET.
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-123456}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}
  cors:
    origins: ${CORS_ORIGINS:*}
  admin:
    email: ${ADMIN_EMAIL:admin@erp.com}
    senha: ${ADMIN_SENHA:admin123}
  seed-demo: ${SEED_DEMO:true}
  afiliados:
    awin:
      # Seu ID de publisher na Awin (Conta > Detalhes). Com ele, links da Awin são montados a partir do endereço do produto.
      publisher-id: ${AWIN_PUBLISHER_ID:}
  estoque:
    permitir-negativo: ${ESTOQUE_PERMITIR_NEGATIVO:false}
  nfe:
    # "simulado" autoriza localmente. Para produção, implemente SefazClient com certificado A1.
    sefaz: ${NFE_SEFAZ:simulado}
    prazo-cancelamento-horas: 24

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
