server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: erp-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
    hikari:
      # Sem conexões paradas: o pool se esvazia 1 min depois do último uso e o Neon (plano grátis)
      # pode dormir, sem gastar horas de computação enquanto ninguém usa a loja.
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    open-in-view: false
    hibernate:
      # "update" cria/ajusta as tabelas automaticamente. Em produção, troque por Flyway/Liquibase + "validate".
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Troque em produção (mínimo 32 caracteres). Use a variável de ambiente JWT_SECRET.
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-123456}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}
  cors:
    origins: ${CORS_ORIGINS:*}
  admin:
    email: ${ADMIN_EMAIL:admin@erp.com}
    senha: ${ADMIN_SENHA:admin123}
  seed-demo: ${SEED_DEMO:true}
  afiliados:
    awin:
      # Seu ID de publisher na Awin (Conta > Detalhes). Com ele, links da Awin são montados a partir do endereço do produto.
      publisher-id: ${AWIN_PUBLISHER_ID:}
  integracoes:
    # Chave que o agendador externo (GitHub Actions) manda no cabeçalho X-Cron-Key para rodar o robô de preços.
    cron-key: ${CRON_KEY:}
    cron: ${PRECOS_CRON:0 7 */6 * * *}
    # Para onde voltar depois de conectar a conta (endereço do painel).
    painel-url: ${PAINEL_URL:/}
    mercadolivre:
      client-id: ${ML_CLIENT_ID:}
      client-secret: ${ML_CLIENT_SECRET:}
      redirect-uri: ${ML_REDIRECT_URI:}
  manter-acordado:
    # O Render preenche RENDER_EXTERNAL_URL sozinho; MANTER_ACORDADO=false desliga.
    url: ${MANTER_ACORDADO_URL:${RENDER_EXTERNAL_URL:}}
    ligado: ${MANTER_ACORDADO:true}
  estoque:
    permitir-negativo: ${ESTOQUE_PERMITIR_NEGATIVO:false}
  nfe:
    # "simulado" autoriza localmente. Para produção, implemente SefazClient com certificado A1.
    sefaz: ${NFE_SEFAZ:simulado}
    prazo-cancelamento-horas: 24

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      # A verificação de saúde é chamada a cada 10 min para manter o servidor acordado;
      # sem isso ela consultaria o banco e o Neon nunca dormiria.
      enabled: false
